<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>김민석 | 소개페이지</title>
    <meta
      name="description"
      content="김민석의 간단한 자기소개 페이지입니다."
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f5f5;
        color: #111;
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
      }

      .card {
        width: min(760px, 100%);
        background: #fff;
        border: 1px solid #ddd;
        padding: 32px;
      }

      .eyebrow {
        margin: 0 0 12px;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #555;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .affiliation,
      .intro,
      .info-block p,
      .contact a {
        font-size: 1rem;
      }

      .affiliation {
        margin-top: 12px;
        color: #333;
      }

      .intro {
        margin-top: 18px;
        line-height: 1.6;
      }

      .info-block {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid #eee;
      }

      .info-block h2 {
        margin: 0 0 8px;
        font-size: 1rem;
      }

      .info-block p {
        margin: 0;
        line-height: 1.6;
      }

      .contact {
        margin-top: 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .contact a {
        display: inline-block;
        padding: 10px 16px;
        background: #111;
        color: #fff;
        text-decoration: none;
      }

      .contact a:hover {
        background: #333;
      }

      @media (max-width: 640px) {
        .card {
          padding: 24px 20px;
        }

        .contact {
          flex-direction: column;
        }

        .contact a {
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <p class="eyebrow">Student Profile</p>
        <h1>김민석</h1>

        <p class="affiliation">
          소속: 국립공주대학교 기계공학전공
        </p>

        <p class="intro">
          기계공학을 공부하는 학생입니다
        </p>

        <div class="info-block">
          <h2>관심</h2>
          <p>자율운항, 제어, AI</p>
        </div>

        <div class="info-block">
          <h2>수업</h2>
          <p>미래첨단기술의이해 I</p>
        </div>

        <div class="contact">
          <a href="mailto:kmseok1229@gmail.com">Email</a>
          <a href="https://github.com/your-github" target="_blank" rel="noreferrer">GitHub</a>
        </div>
      </section>
    </main>
  </body>
</html>
